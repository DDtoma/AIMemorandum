[package]
name = "aimemorandum-windows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aimemorandum-core = { path = "../core" }
aimemorandum-ui = { path = "../ui" }
arboard = "3.7"
chrono = "0.4"
global-hotkey = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "~1.18", features = ["unstable-winit-030"] }
thiserror = "2"
tray-icon = "0.26"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_IO", "Win32_Security", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
xcap = "0.9"

[dev-dependencies]
tempfile = "3"
